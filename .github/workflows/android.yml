name: Verify native Android

on:
  workflow_dispatch:
    inputs:
      attach_to_v013_draft:
        description: Attach the verified APK and checksum to the v0.13.0 release draft
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the downloadable APK and install test tools
        run: |
          (cd builds && sha256sum --check tabara-frontier-v0.13.apk.sha256)
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Mirne/Tabara/a60fb83bd341a60aad0a56449dab730806d72e47/builds/tabara-frontier-v0.12.apk --output "$RUNNER_TEMP/tabara-v012.apk"
          printf '%s  %s\n' 82e1915bb3bcb6873a3fb2fc4e9bee04e4ddb523fcf0835ea7f015b1067ad39e "$RUNNER_TEMP/tabara-v012.apk" | sha256sum --check
          python3 -m venv "$RUNNER_TEMP/tabara-test-python"
          "$RUNNER_TEMP/tabara-test-python/bin/pip" install Pillow
      - name: Exercise actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb root
            adb wait-for-device
            adb shell settings put secure immersive_mode_confirmations confirmed
            ANDROID_TEST_ROOT=1 ANDROID_SERIAL=emulator-5554 ANDROID_PREVIOUS_APK="$RUNNER_TEMP/tabara-v012.apk" ANDROID_REPORT_NAME=android-upgrade "$RUNNER_TEMP/tabara-test-python/bin/python" tests/android_upgrade.py
            ANDROID_TEST_ROOT=1 ANDROID_SERIAL=emulator-5554 "$RUNNER_TEMP/tabara-test-python/bin/python" tests/android_smoke.py
      - name: Show native check evidence
        if: always()
        run: |
          test ! -f test-results/android-upgrade/report.json || cat test-results/android-upgrade/report.json
          test ! -f test-results/android-frontier/report.json || cat test-results/android-frontier/report.json
          test ! -f test-results/android-frontier/logcat.txt || tail -80 test-results/android-frontier/logcat.txt
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-evidence-api-${{ matrix.api }}
          path: |
            test-results/android-frontier
            test-results/android-upgrade
          retention-days: 7

  attach-tested-build:
    needs: android
    if: github.ref == 'refs/heads/main' && inputs.attach_to_v013_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach both files to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd builds && sha256sum --check tabara-frontier-v0.13.apk.sha256)
          test "$(gh release view v0.13.0 --json isDraft --jq .isDraft)" = true
          gh release upload v0.13.0 builds/tabara-frontier-v0.13.apk builds/tabara-frontier-v0.13.apk.sha256 --clobber
