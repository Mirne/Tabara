name: Verify native Android

on:
  workflow_dispatch:
    inputs:
      android_api:
        description: Android API level to verify
        type: choice
        default: '36'
        options:
          - all
          - '24'
          - '35'
          - '36'
      navigation_only:
        description: Verify system navigation on the selected image
        type: boolean
        default: false
      full_smoke:
        description: Also run the full fresh-install gameplay suite
        type: boolean
        default: false
      attach_to_patch_draft:
        description: Attach the verified APK and checksum to the v0.13.1 release draft
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.android_api == 'all' && '[24,35,36]' || format('[{0}]', inputs.android_api)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the downloadable APK and install test tools
        run: |
          (cd builds && sha256sum --check tabara-frontier-v0.13.1.apk.sha256)
          curl --fail --location --retry 3 https://github.com/Mirne/Tabara/releases/download/v0.13.0/tabara-frontier-v0.13.apk --output "$RUNNER_TEMP/tabara-v013.apk"
          printf '%s  %s\n' aa4fb07bdac02c3c328db720a32e5583e9da88c4a200a0c5639b61f0822ec8d5 "$RUNNER_TEMP/tabara-v013.apk" | sha256sum --check
          python3 -m venv "$RUNNER_TEMP/tabara-test-python"
          "$RUNNER_TEMP/tabara-test-python/bin/pip" install Pillow
      - name: Exercise actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EXPECTED_RASTER: ${{ matrix.api == 36 && '1544x720' || '' }}
          TABARA_ANDROID_API: ${{ matrix.api }}
          TABARA_BACK_PROBE: ${{ inputs.navigation_only }}
          TABARA_FULL_SMOKE: ${{ inputs.full_smoke }}
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/run_android_checks.sh
      - name: Show native check evidence
        if: always()
        run: |
          test ! -f test-results/android-patch-upgrade/report.json || cat test-results/android-patch-upgrade/report.json
          test ! -f test-results/android-frontier/report.json || cat test-results/android-frontier/report.json
          test ! -f test-results/android-frontier/logcat.txt || tail -80 test-results/android-frontier/logcat.txt
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-evidence-api-${{ matrix.api }}
          path: |
            test-results/android-frontier
            test-results/android-patch-upgrade
          retention-days: 7

  attach-tested-build:
    needs: android
    if: github.ref == 'refs/heads/main' && !inputs.navigation_only && inputs.attach_to_patch_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach both files to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd builds && sha256sum --check tabara-frontier-v0.13.1.apk.sha256)
          test "$(gh release view v0.13.1 --json isDraft --jq .isDraft)" = true
          gh release upload v0.13.1 builds/tabara-frontier-v0.13.1.apk builds/tabara-frontier-v0.13.1.apk.sha256 --clobber
